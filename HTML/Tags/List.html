<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> OderedList</title>
</head>
<body>
  <header>
  </header>
  <main>
    <ol>
      <li>apple</li>
      <ol>
        <li>color : red</li>
        <li> season : winter</li>
      </ol>
      <li>mango</li>
      <ol>
        <li>color : yellow</li>
        <li> season : summer</li>
      </ol>
      <li>orange</li>
      <ol>
        <li>color : orange</li>
        <li> season : summer</li>
      </ol>
    </ol>
  </main>
</body>
</html>
